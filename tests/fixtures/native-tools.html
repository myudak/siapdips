<!doctype html><html><head><meta charset="utf-8"><title>Native Tools fixture</title><style>body{font:18px Georgia;background:white;color:#123;margin:20px;min-height:2000px}h1{font-size:32px}#sticky{position:fixed;bottom:10px;right:10px;background:lightblue;padding:12px}</style></head><body><h1>Native extension test</h1><p>Local media and screenshot fixture.</p><button id="start">Start local test audio</button><video id="video" muted loop src="/scratch/tools-native-tone.wav" width="400" height="220"></video><div id="sticky">Fixed fixture</div><script>document.getElementById('start').onclick=async()=>{const ctx=new AudioContext(),osc=ctx.createOscillator(),gain=ctx.createGain();gain.gain.value=.01;osc.connect(gain).connect(ctx.destination);osc.start();window.audio=ctx;await document.getElementById('video').play();};</script></body></html>
